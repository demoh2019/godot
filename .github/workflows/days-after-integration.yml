name: Days After survival integration

on:
  push:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-integration.yml'
  pull_request:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-play-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot Linux editor (verified)
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import and exercise survival game
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path demo/days_after --editor --import --quit 2>&1 | tee import.log
          ./godot --headless --path demo/days_after --script res://smoke_test.gd 2>&1 | tee smoke.log
          grep -Eq '^PASS: Days After .*physics frames\.' smoke.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' import.log smoke.log; then
            exit 1
          fi
