name: Native spatial sound event admission and Albion

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/gameplay_fx/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_spatial_emission.gd'
      - 'game/tests/test_spatial_sound_event_policy.gd'
      - 'game/tests/run_spatial_sound_event_policy.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_spatial_sound_event_policy_contract.py'
      - '.github/workflows/native-spatial-sound-events.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/gameplay_fx/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_spatial_emission.gd'
      - 'game/tests/test_spatial_sound_event_policy.gd'
      - 'game/tests/run_spatial_sound_event_policy.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_spatial_sound_event_policy_contract.py'
      - '.github/workflows/native-spatial-sound-events.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static wiring contracts (not sufficient as native evidence)
        run: python3 -m unittest tests/scene/test_spatial_sound_event_policy_contract.py -v

  native-game:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native spatial event policy doctests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*SpatialSoundEventPolicy*" --no-colors 2>&1 | tee sound-native.log
          if grep -Ei 'FAILED|failed assertions|test cases:.*failed' sound-native.log; then exit 1; fi
      - name: Import Albion After
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee sound-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' sound-import.log; then exit 1; fi
      - name: Focused native and portable audio regression
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --path game --script res://tests/run_spatial_sound_event_policy.gd 2>&1 | tee sound-game.log
          grep -E '^SPATIAL SOUND TOTAL: [0-9]+ checks, 0 failures$' sound-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' sound-game.log; then exit 1; fi
      - name: Complete Albion After headless suite
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 600s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee sound-full.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' sound-full.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' sound-full.log; then exit 1; fi
      - name: Upload build and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-spatial-sound-events
          if-no-files-found: ignore
          path: |
            sound-native.log
            sound-import.log
            sound-game.log
            sound-full.log
